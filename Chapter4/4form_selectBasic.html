<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>4form_selectBasic</title>
</head>
<body>
    <h2>한 항목만 선택하기</h2>
    <select>
        <option>국밥</option>
        <option>생선</option>
        <option>한식</option>
        <option>중식</option>
    </select>

    <h2>여러 항목 선택하기</h2>
    <select multiple="multiple">
        <option>국밥</option>
        <option>생선</option>
        <option>한식</option>
        <option>중식</option>
    </select>

    <h2>선택 옵션 묶기</h2>
    <select>
        <optgroup label="HTML5">
            <option>Multimedia Tag</option>
            <option>Connectivity</option>
            <option>Device Access</option>
        </optgroup>
        <optgroup label="CSS3">
            <option>Animation</option>            
            <option>3D Transform</option>
        </optgroup>
    </select>
</body>
</html>
