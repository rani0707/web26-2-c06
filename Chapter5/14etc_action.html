<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>5반응/상태/구조 선택자</title>
    <style>
        h2:hover { color: red; }
        h2:active { color: blue; }

        /* input태그가 사용 가능할 때 */
        input:enabled { background-color: white; }
        /* input태그가 사용 불가능할 때 */
        input:disabled { background-color: gray; }
        /* input태그에 포커스를 맞출 때 */
        input:focus { background-color: orange; }
    </style>
</head>
<body>
    <h2>5.1반응 선택자</h2>
    <h2>5.2상태 선택자</h2>
    <hr>
    
    <h3>사용 가능</h3>
    <input>
    <h3>사용 불가능</h3>
    <input disabled="disabled">
</body>
</html>
