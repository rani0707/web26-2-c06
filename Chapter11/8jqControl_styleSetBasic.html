<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Basic</title>
    <script src="https://code.jQuery.com/jQuery-3.6.4.js"></script>
    <script>
        $(document).ready(function () {
            $('.box').css('float', 'left');
            $('.box').css('margin', 10);
            $('.box').css('width', 100);
            $('.box').css('height', 100);
            $('.box').css('backgroundColor', 'red');
        });
    </script>
</head>
<body> 
<h4>3.2스타일 조작</h4>
    <ol>
        <li><b>속성 값을 입력해 속성 지정하기</b></li>
        <li>객체를 입력해 속성 지정하기</li>
        <li>함수를 이용해 속성 지정하기</li>
    </ol>
    <hr>

    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
</body>
</html>
